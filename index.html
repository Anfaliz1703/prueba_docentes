<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Un minuto para enseñar</title>
  <meta name="description" content="Una frase para docentes cada minuto." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="quote-card" aria-live="polite">
      <div class="eyebrow">UN MINUTO PARA ENSEÑAR</div>

      <div class="quote-mark" aria-hidden="true">“</div>
      <blockquote id="quote" class="quote">Cargando la frase más reciente…</blockquote>
      <p id="author" class="author">— Bitácora versionada de frases docentes</p>
      <p id="latestEntry" class="latest-entry" role="status"></p>

      <section class="history" aria-labelledby="historyTitle">
        <div class="history-header">
          <h2 id="historyTitle">Últimas inserciones</h2>
          <span id="historyCount" class="history-count"></span>
        </div>
        <ul id="historyList" class="history-list">
          <li class="history-item history-empty">Cargando bitácora…</li>
        </ul>
      </section>
    </section>

    <footer>
      <span>Una pausa breve. Una idea útil.</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
